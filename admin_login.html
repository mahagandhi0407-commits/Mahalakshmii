{% extends "base.html" %}

{% block content %}

<section class="auth-container">

    <div class="card auth-card">

        <div class="badge">
            ADMIN
        </div>

        <h1>
            Admin Login
        </h1>

        <p class="muted">
            Sign in to view registered FitBuddy users.
        </p>


        {% if error %}

        <div class="error-box">
            {{ error }}
        </div>

        {% endif %}


        <form
            action="/admin/login"
            method="post"
        >

            <div class="form-group">

                <label>
                    Username
                </label>

                <input
                    type="text"
                    name="username"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    required
                >

            </div>


            <button
                type="submit"
                class="primary-button"
            >
                Login
            </button>

        </form>

    </div>

</section>

{% endblock %}
