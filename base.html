<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {{ title or "FitBuddy" }}
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='style.css') }}"
    >
</head>

<body>

<header class="navbar">

    <div class="nav-container">

        <a href="/" class="logo">
            Fit<span>Buddy</span>
        </a>

        <nav>
            <a href="/">Home</a>
            <a href="/admin/login">Admin</a>
        </nav>

    </div>

</header>


<main class="page-container">

    {% block content %}
    {% endblock %}

</main>


<footer>

    <p>
        FitBuddy &copy; 2026 |
        AI Fitness Plan Generator
    </p>

    <p class="disclaimer">
        General wellness guidance only. Stop any activity
        that causes pain and seek appropriate professional
        advice when needed.
    </p>

</footer>


<script
    src="{{ url_for('static', path='script.js') }}"
></script>

</body>
</html>
