{% extends "base.html" %}

{% block content %}

<section class="auth-container">

    <div class="card error-card">

        <div class="badge">
            SOMETHING WENT WRONG
        </div>

        <h1>
            {{ title }}
        </h1>

        <p>
            {{ message }}
        </p>

        <a
            href="/"
            class="primary-button inline-button"
        >
            Back to FitBuddy
        </a>

    </div>

</section>

{% endblock %}
