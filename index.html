```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitBuddy - AI Fitness Planner</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #111827, #1f2937);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background: rgba(255, 255, 255, 0.08);
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.35);
        }

        h1 {
            text-align: center;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #d1d5db;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-top: 16px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
        }

        input:focus,
        select:focus {
            outline: 2px solid #60a5fa;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            color: #9ca3af;
            font-size: 13px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>FitBuddy 🏋️</h1>

    <p class="subtitle">
        AI-powered personalized fitness planner
    </p>

    <form action="/generate-workout" method="post">

        <label for="username">Name</label>
        <input
            type="text"
            id="username"
            name="username"
            placeholder="Enter your name"
            required
        >

        <label for="user_id">User ID</label>
        <input
            type="text"
            id="user_id"
            name="user_id"
            placeholder="Enter your User ID"
            required
        >

        <label for="age">Age</label>
        <input
            type="number"
            id="age"
            name="age"
            min="13"
            max="100"
            placeholder="Enter your age"
            required
        >

        <label for="weight">Weight (kg)</label>
        <input
            type="number"
            id="weight"
            name="weight"
            min="20"
            max="300"
            step="0.1"
            placeholder="Enter your weight"
            required
        >

        <label for="goal">Fitness Goal</label>
        <select id="goal" name="goal" required>
            <option value="">Select your goal</option>
            <option value="general wellness">General Wellness</option>
            <option value="weight loss">Weight Loss</option>
            <option value="muscle gain">Muscle Gain</option>
            <option value="flexibility">Flexibility</option>
            <option value="fitness improvement">Fitness Improvement</option>
        </select>

        <label for="intensity">Workout Intensity</label>
        <select id="intensity" name="intensity" required>
            <option value="">Select intensity</option>
            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="high">High</option>
        </select>

        <button type="submit">
            Generate My Plan 🚀
        </button>

    </form>

    <div class="footer">
        FitBuddy AI • Personalized Fitness Assistant
    </div>

</div>

</body>
</html>
```
